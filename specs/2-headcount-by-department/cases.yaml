      rows:
        - [（未設定）, 1]

  - id: TC2-21
    spec_ref: ルール1, 仮定A2-3
    viewpoint: 境界値
    title: 全員が退職済みなら見出しだけを書く
    given: 全員が退職済みの名簿
    when: 基準日 2026-11-15 で実行
    then: エラーにならず、集計結果は0件
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, {date: "2026-03-31"}]
        - [E0002, 鈴木 一郎, 営業部, {date: "2026-11-14"}]
    expected:
      rows: []
