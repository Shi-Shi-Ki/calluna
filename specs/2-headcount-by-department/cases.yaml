  - id: TC2-14
    spec_ref: 仮定A2-7
    viewpoint: 空の値
    title: すべて空の行は無視する
    given: データ行の後ろに空行が2行ある
    when: 基準日 2026-11-15 で実行
    then: 空行はエラーにならず、在籍者だけが数えられる
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
        - ["", "", "", ""]
        - ["", "", "", ""]
    expected:
      rows:
        - [総務部, 1]

  - id: TC2-15
    spec_ref: 入力
    viewpoint: 空の値
    title: データ行がなければ空の集計結果を返す
    given: ヘッダー行だけのシート
    when: 基準日 2026-11-15 で実行
    then: エラーにならず、集計結果は0件
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
    expected:
      rows: []

  - id: TC2-16
    spec_ref: 仮定A2-5
    viewpoint: 空の値
    title: 社員番号が空の行があれば全体を止める
    given: 社員番号が空の社員が1人、正常な社員が1人
    when: 基準日 2026-11-15 で実行
    then: 不正な値のエラーになり、正常な行も含めて何も書かない
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - ["", 佐藤 花子, 総務部, ""]
