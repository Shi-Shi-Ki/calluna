# ケース表の正本。人が読むのは cases.md（このファイルから自動生成）。
# 実装フェーズでは AI はこのファイルを変更できない（hook と CI のロック検査）。
spec: "#2"
title: 部署ごとの在籍人数を集計する
risk: 中
target: src/headcount.js#buildHeadcount

# AIが選んだ解釈。人が承認した時点で仕様の一部になる。
assumptions:
  - id: A2-1
    text: 「在籍」は、退職日が空、または退職日が基準日より後の日の社員（Issueコメントの回答B1）。退職日が基準日以前（退職日当日を含む）なら退職済み。比較は日付単位で、セルに時刻が入っていても当日の23:59は当日として扱う。
  - id: A2-2
    text: 人数が同じ部署は、部署名の昇順（文字コード順）に並べる（回答B2）。
  - id: A2-3
    text: 在籍者が0人の部署（全員退職）は出力しない（回答B3）。名簿全体で在籍者が0人なら、見出しだけを書く。
  - id: A2-4
    text: 社員番号の重複は、退職済みの行も含めて検査する（回答B5）。
  - id: A2-5
    text: 社員番号・氏名が空の行が1行でもあれば、全体を止めて何も書かない（回答B4）。
  - id: A2-6
    text: 退職日が空でも日付でもない行（例 #REF!）が1行でもあれば、全体を止めて何も書かない（回答B4）。
  - id: A2-7
    text: すべての列が空の行は無視する（シート末尾の空行を想定）。
  - id: A2-8
    text: 基準日は実行日（GASではスクリプトのタイムゾーンの当日）とする。
  - id: A2-9
    text: 出力は1行目に見出し「部署」「人数」を書き、その下に集計結果を書く。
  - id: A2-10
    text: 部署が空（空文字・空白だけ）の行は、部署「（未設定）」として数える（回答B4）。「（未設定）」は全角括弧。並び順は他の部署と同じ規則（人数の多い順、同数は文字コード順）。
  - id: A2-11
    text: 部署名・社員番号は前後の空白を取り除いてから比較する（「総務部 」と「総務部」は同じ部署）。全角と半角の正規化はしない（別の値として扱う）。

# 仕様の中の「比較」と「区切り」。各点に対応するケースを置く。
boundaries:
  - name: 退職日と基準日（ルール1）
    points:
      - { value: 退職日が基準日の前日（退職済み・数えない）, case: TC2-02 }
      - { value: 退職日が基準日と同じ日（数えない）, case: TC2-04 }
      - { value: 退職日が基準日と同じ日の23:59（数えない）, case: TC2-18 }
      - { value: 退職日が基準日の翌日（在籍・数える）, case: TC2-03 }
  - name: 部署の在籍者数（ルール1・2）
    points:
      - { value: 0人（全員退職・出さない）, case: TC2-06 }
      - { value: 1人, case: TC2-02 }
      - { value: 2人以上, case: TC2-01 }
  - name: 名簿の件数
    points:
      - { value: データ行0件, case: TC2-15 }
      - { value: 在籍者0人（全員退職）, case: TC2-21 }
      - { value: 1行だけ, case: TC2-03 }
      - { value: 複数行, case: TC2-01 }
  - name: 人数の並び順（ルール2）
    points:
      - { value: 人数が異なる（多い順）, case: TC2-01 }
      - { value: 人数が同じ・入力が部署名の逆順（部署名の昇順）, case: TC2-05 }
  - name: 部署名の文字列
    points:
      - { value: 空文字（（未設定）として数える）, case: TC2-12 }
      - { value: 空白だけ（（未設定）として数える）, case: TC2-20 }
      - { value: 前後に空白（同じ部署として数える）, case: TC2-19 }
  - name: 部署ごとのグループ化
    points:
      - { value: 1部署だけ, case: TC2-02 }
      - { value: 全員が対象外の部署がある, case: TC2-06 }
      - { value: 複数部署, case: TC2-01 }

# 機械では判定できず、人が確認する項目。
manual_checks:
  - id: M2-01
    item: 実際の名簿で集計し、総務が手で数えた人数と部署ごとに一致する
    when: リリース前に検証用の名簿で1回
  - id: M2-02
    item: 退職日が未来の社員・退職日当日の社員の扱い（仮定A2-1）が総務の運用に合っている
    when: 承認前
  - id: M2-03
    item: 「部署別人数」シートの書き直しで、過去の内容が消えても問題ない
    when: リリース前

cases:
  - id: TC2-01
    spec_ref: ルール1, ルール2, 例1
    viewpoint: 正常
    title: 部署ごとの人数を多い順に出す
    given: 総務部2人、営業部3人（全員在籍中）
    when: 基準日 2026-11-15 で実行
    then: 営業部 3、総務部 2 の順に出る
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
        - [E0002, 鈴木 一郎, 総務部, ""]
        - [E0003, 高橋 次郎, 営業部, ""]
        - [E0004, 田中 三郎, 営業部, ""]
        - [E0005, 伊藤 四郎, 営業部, ""]
    expected:
      rows:
        - [営業部, 3]
        - [総務部, 2]

  - id: TC2-02
    spec_ref: ルール1, 仮定A2-1
    viewpoint: 境界値
    title: 退職日が基準日の前日の社員は数えない
    given: 総務部に在籍1人と、退職日が基準日の前日の社員1人
    when: 基準日 2026-11-15 で実行
    then: 総務部は1人
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
        - [E0002, 鈴木 一郎, 総務部, {date: "2026-11-14"}]
    expected:
      rows:
        - [総務部, 1]

  - id: TC2-03
    spec_ref: ルール1, 仮定A2-1
    viewpoint: 境界値
    title: 退職日が基準日より後の社員は在籍として数える
    given: 退職日が基準日の翌日の社員が1人
    when: 基準日 2026-11-15 で実行
    then: 総務部は1人
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, {date: "2026-11-16"}]
    expected:
      rows:
        - [総務部, 1]

  - id: TC2-04
    spec_ref: ルール1, 仮定A2-1
    viewpoint: 境界値
    title: 退職日が基準日当日の社員は数えない
    given: 退職日が基準日と同じ日の社員が1人、在籍中が1人
    when: 基準日 2026-11-15 で実行
    then: 総務部は1人
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
        - [E0002, 鈴木 一郎, 総務部, {date: "2026-11-15"}]
    expected:
      rows:
        - [総務部, 1]

  - id: TC2-05
    spec_ref: ルール2, 仮定A2-2
    viewpoint: 境界値
    title: 人数が同じ部署は部署名の昇順に並べる
    given: 人数が同じ部署（営業部・人事部・総務部）を、昇順でない並びで入力
    when: 基準日 2026-11-15 で実行
    then: 部署名の昇順（人事部、総務部、営業部）で出る
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
        - [E0002, 鈴木 一郎, 営業部, ""]
        - [E0003, 高橋 次郎, 人事部, ""]
    expected:
      rows:
        - [人事部, 1]
        - [営業部, 1]
        - [総務部, 1]

  - id: TC2-06
    spec_ref: ルール1, 仮定A2-3
    viewpoint: 正常
    title: 全員が退職済みの部署は出さない
    given: 総務部は全員退職済み、営業部は在籍1人
    when: 基準日 2026-11-15 で実行
    then: 営業部 1 だけが出る
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, {date: "2026-03-31"}]
        - [E0002, 鈴木 一郎, 営業部, ""]
    expected:
      rows:
        - [営業部, 1]

  - id: TC2-07
    spec_ref: ルール3
    viewpoint: 重複
    title: 社員番号が重複していたら何も書かずに止める
    given: 社員番号 E0001 が2行ある
    when: 基準日 2026-11-15 で実行
    then: 重複のエラーになり、何も書かない
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
        - [E0001, 鈴木 一郎, 営業部, ""]
    expected:
      error: DUPLICATE_ID

  - id: TC2-08
    spec_ref: ルール3, 仮定A2-4
    viewpoint: 重複
    title: 退職済みの行と重複していても止める
    given: 社員番号 E0001 が在籍中の行と退職済みの行にある
    when: 基準日 2026-11-15 で実行
    then: 重複のエラーになり、何も書かない
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
        - [E0001, 佐藤 花子, 総務部, {date: "2026-03-31"}]
    expected:
      error: DUPLICATE_ID

  - id: TC2-09
    spec_ref: 異常時の挙動
    viewpoint: シートの破損
    title: 必要なヘッダーが見つからなければ何も書かずに止める
    given: 「部署」列のヘッダー名が「所属」に変わっている
    when: 基準日 2026-11-15 で実行
    then: 「部署」列がないというエラーになり、部署別人数は書き換えない
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 所属, 退職日]
        - [E0001, 佐藤 花子, 総務部, ""]
    expected:
      error: HEADER_MISSING

  - id: TC2-10
    spec_ref: 異常時の挙動
    viewpoint: シートの破損
    title: 列が足りなければ何も書かずに止める
    given: 「退職日」列がないシート（3列だけ）
    when: 基準日 2026-11-15 で実行
    then: 「退職日」列がないというエラーになり、部署別人数は書き換えない
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署]
        - [E0001, 佐藤 花子, 総務部]
    expected:
      error: HEADER_MISSING

  - id: TC2-11
    spec_ref: 入力, 異常時の挙動
    viewpoint: シートの破損
    title: 列の順序が違ってもヘッダー名で列を特定する
    given: 列が「部署, 退職日, 社員番号, 氏名」の順に並んでいる
    when: 基準日 2026-11-15 で実行
    then: 列の位置に関係なく、在籍者だけが部署ごとに数えられる
    input:
      today: "2026-11-15"
      sheet:
        - [部署, 退職日, 社員番号, 氏名]
        - [総務部, "", E0001, 佐藤 花子]
        - [総務部, {date: "2026-03-31"}, E0002, 鈴木 一郎]
        - [営業部, "", E0003, 高橋 次郎]
        - [営業部, "", E0004, 田中 三郎]
    expected:
      rows:
        - [営業部, 2]
        - [総務部, 1]

  - id: TC2-12
    spec_ref: 仮定A2-10
    viewpoint: 空の値
    title: 部署が空の行は「（未設定）」として数える
    given: 部署が空の社員が2人、総務部が1人
    when: 基準日 2026-11-15 で実行
    then: （未設定）2、総務部 1 の順に出る
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, "", ""]
        - [E0002, 鈴木 一郎, 総務部, ""]
        - [E0003, 高橋 次郎, "", ""]
    expected:
      rows:
        - [（未設定）, 2]
        - [総務部, 1]

  - id: TC2-13
    spec_ref: 入力, 仮定A2-6
    viewpoint: 異常値
    title: 退職日が日付でない行があれば全体を止める
    given: 退職日が「#REF!」の社員が1人、正常な社員が1人
    when: 基準日 2026-11-15 で実行
    then: 不正な値のエラーになり、正常な行も含めて何も書かない
    input:
      today: "2026-11-15"
      sheet:
        - [社員番号, 氏名, 部署, 退職日]
        - [E0001, 佐藤 花子, 総務部, "#REF!"]
        - [E0002, 鈴木 一郎, 総務部, ""]
    expected:
