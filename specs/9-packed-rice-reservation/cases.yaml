# ケース表の正本。人が読むのは cases.md（このファイルから自動生成）。
# 実装フェーズでは AI はこのファイルを変更できない（hook と CI のロック検査）。
spec: "#9"
title: パックライスの予約一覧・上限通知
risk: 中
target: src/packrice.js#buildReservationPlan
decisions:
  - id: D9-1
    text: 受付時間（7:00〜10:30）はフォームの有効化・無効化のトリガーで制御する。集計側では時間で絞らない（時間外のタイムスタンプでも除外しない）。
    source: 回答B1
  - id: D9-2
    text: 同じメールアドレスの回答は最初の1件だけを一覧に出す。2件目以降は一覧に出さず、上限にも数えない。
    source: 回答B2
  - id: D9-3
    text: フォームのプルダウンは管理シートの拠点名の列から作る。万が一マスターにない拠点名の回答があれば、一覧に出さず xl-system-alert に通知する。
    source: 回答B3
  - id: D9-4
    text: 上限に達している（有効な予約者数が配布個数以上）なら、集計を実行するたびに、その拠点の通知先チャンネルへ「本日の予約分は終了しました」を送る（再送を抑えない）。
    source: 回答B4
  - id: D9-5
    text: 日次の洗い替えは、フォームと集計スプレッドシートを日付付きで新規作成する。旧ファイルは残す。
    source: 回答B5
  - id: D9-6
    text: 管理シートに不正な行（拠点名が未入力／配布個数が未入力または1未満／通知先が未入力または存在しない）があるとき、その拠点だけ処理しない（シートも出さず、上限通知も送らず）。xl-system-alert に通知し、正常な拠点は通常どおり処理する。
    source: 回答B6
  - id: D9-7
    text: 回答シート（フォーム）が毎日新しくなっても、予約者が使うURLは常に1つにする。そのURLにアクセスすると、当日のフォームへ転送する。
    source: 追加の仕様（Issueコメント）
assumptions:
  - id: A9-1
    text: 重複の判定は、拠点をまたいでメールアドレス単位で行う。回答シートの行の順を受付順とし、最初に出てきた行を採用する。
  - id: A9-2
    text: 拠点名はマスターと完全一致で比べる。前後の空白や全角半角の違いは別の拠点名として扱い、不一致として通知する（プルダウンから作るので、違いは異常とみなす）。
  - id: A9-3
    text: 回答の氏名またはメールアドレスが空の行があれば、全体を止めて何も書かない（フォームの必須項目が壊れている異常として扱う）。
  - id: A9-4
    text: すべての列が空の行は、回答シート・管理シートとも無視する。
  - id: A9-5
    text: 配布個数は1以上の整数の数値だけを有効とする。数値でない値、小数は不正な行として扱う。
  - id: A9-6
    text: 管理シートで同じ拠点名が複数行ある場合、該当するすべての行を不正として処理しない。
  - id: A9-7
    text: フォームの選択肢は、拠点名が空でない行を管理シートの順に並べ、重複は1つにする。配布個数や通知先が不正な拠点も選択肢には含める（通知は管理シート側の不正の通知で行う）。
  - id: A9-8
    text: 管理シートの不正な拠点宛の回答は、追加の通知なしで除外する（管理シートの不正で既に通知しているため）。通知の宛先は固定の xl-system-alert で、純粋関数は通知の種類と行番号だけを返す。
  - id: A9-9
    text: 固定URLは Apps Script のウェブアプリとして用意し、新しいフォームを作るたびに当日のフォームの公開URLを保存して、アクセス時にそこへ転送する。転送先が未設定・空白だけ・Googleフォーム（https://docs.google.com/forms/ で始まる）以外のときは転送せず、「受付準備中」を表示して xl-system-alert に通知する（任意のURLへの転送を防ぐ）。純粋関数は転送先か、エラーの種類だけを返す。
boundaries:
  - name: 配布個数の下限（1未満は不正）
    points:
      - value: 0（不正）
        case: TC9-21
      - value: 1（ちょうど有効）
        case: TC9-06
      - value: 2（すぐ内側）
        case: TC9-02
  - name: 予約件数と上限（上限2の場合）
    points:
      - value: 上限-1（1件。通知なし）
        case: TC9-02
      - value: 上限ちょうど（2件。通知）
        case: TC9-03
      - value: 上限+1（3件。3件目は出さない）
        case: TC9-04
      - value: 0件
        case: TC9-05
  - name: 同じメールアドレスの回答数
    points:
      - value: 1件（重複なし）
        case: TC9-01
      - value: 2件
        case: TC9-07
      - value: 3件以上
        case: TC9-08
      - value: 別フロアで重複
        case: TC9-09
  - name: 拠点名の一致（文字列）
    points:
      - value: 完全一致
        case: TC9-01
      - value: 後ろに空白
        case: TC9-12
      - value: 全角と半角
        case: TC9-13
      - value: 空文字
        case: TC9-14
      - value: マスターにない名前
        case: TC9-11
  - name: 拠点の数
    points:
      - value: 0拠点（ヘッダーのみ）
        case: TC9-31
      - value: 1拠点
        case: TC9-02
      - value: 2拠点以上
        case: TC9-01
      - value: 全拠点が不正
        case: TC9-29
  - name: 通知先チャンネル
    points:
      - value: 存在する
        case: TC9-03
      - value: 未入力
        case: TC9-26
      - value: 存在しない
        case: TC9-27
  - name: 受付時間（フォーム側で制御）
    points:
      - value: 7:00より前（6:59）も除外しない
        case: TC9-10
      - value: 10:30より後（10:31）も除外しない
        case: TC9-10
  - name: 管理シートの拠点名の重複
    points:
      - value: 重複なし
        case: TC9-01
      - value: 同じ拠点名が2行
        case: TC9-28
  - name: フォームURLの入力（固定URLの転送先）
    points:
      - value: 正常なURL
        case: TC9-36
      - value: 前後に空白があるURL
        case: TC9-37
      - value: 空文字
        case: TC9-38
      - value: 空白だけ
        case: TC9-39
      - value: Googleフォーム以外のURL
        case: TC9-40
manual_checks:
  - id: M9-01
    item: フォームの有効化・無効化のトリガーが 7:00 と 10:30 に動く
    when: リリース初日
  - id: M9-02
    item: 上限到達時に、拠点ごとの通知先チャンネルへ「本日の予約分は終了しました」が届く。不正・不一致の通知が xl-system-alert に届く
    when: 検証用 Slack で1回
  - id: M9-03
    item: 毎日、フォームと「パックライス予約一覧（YYYY-MM-DD）」が新規に作られ、旧ファイルが残る。閲覧シートは利用者が編集できず、編集は総務部とシステム管理者だけ
    when: リリース初日
  - id: M9-05
    item: 固定URLにアクセスすると当日のフォームが開く。翌日にフォームが作り直されても、同じURLで新しい当日のフォームが開く。転送先が未設定のときは「受付準備中」が表示される
    when: リリース初日と翌日
  - id: M9-04
    item: フォームの拠点のプルダウンが管理シートの拠点名と一致し、氏名がメールアドレスから自動設定される
    when: 検証用フォームで1回
