# ケース表の正本。人が読むのは cases.md（このファイルから自動生成）。
# 実装フェーズでは AI はこのファイルを変更できない（hook と CI のロック検査）。
spec: "#1"
title: 期限切れの未処理申請を督促リストに出す
risk: 中
target: src/overdue.js#buildOverdueList

# AIが選んだ解釈。人が承認した時点で仕様の一部になる。
assumptions:
  - id: A1-1
    text: 「期限切れ」は期限日が基準日より前の日。期限当日は含めない。
  - id: A1-2
    text: 期限が日付でない行が1行でもあれば、全体を止めて何も書かない（部分的な出力をしない）。
  - id: A1-3
    text: すべての列が空の行は無視する（シート末尾の空行を想定）。

# 機械では判定できず、人が確認する項目。
manual_checks:
  - id: M1-01
    item: 督促リストの日付が yyyy/MM/dd で表示される
    when: リリース前に検証用シートで1回
  - id: M1-02
    item: 時間主導トリガーが毎朝7時台に動き、失敗時に通知が届く
    when: リリース初日

cases:
  - id: TC1-01
    spec_ref: ルール1, 例1
    viewpoint: 正常
    title: 期限切れかつ未処理の申請だけを督促リストに出す
    given: 申請一覧に「期限切れ・未処理」「期限内・未処理」「期限切れ・処理済み」が1件ずつ
    when: 基準日 2026-11-15 で実行
    then: 督促リストに「期限切れ・未処理」の1件だけが、超過日数つきで出る
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 期限, ステータス]
        - [R-001, 佐藤, {date: "2026-11-10"}, 未処理]
        - [R-002, 鈴木, {date: "2026-11-20"}, 未処理]
        - [R-003, 高橋, {date: "2026-11-01"}, 処理済み]
    expected:
      rows:
        - [R-001, 佐藤, "2026-11-10", 5]

  - id: TC1-02
    spec_ref: ルール1, 仮定A1-1
    viewpoint: 境界値
    title: 期限当日の申請は督促しない
    given: 期限が基準日と同じ日の未処理申請が1件、前日の未処理申請が1件
    when: 基準日 2026-11-15 で実行
    then: 前日の1件だけが超過日数1で出る
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 期限, ステータス]
        - [R-010, 佐藤, {date: "2026-11-15"}, 未処理]
        - [R-011, 鈴木, {date: "2026-11-14"}, 未処理]
    expected:
      rows:
        - [R-011, 鈴木, "2026-11-14", 1]

  - id: TC1-03
    spec_ref: ルール2
    viewpoint: 正常
    title: 期限の古い順に並べる
    given: 期限切れ・未処理の申請が期限の新しい順に3件
    when: 基準日 2026-11-15 で実行
    then: 期限の古い順に3件出る
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 期限, ステータス]
        - [R-021, 佐藤, {date: "2026-11-12"}, 未処理]
        - [R-022, 鈴木, {date: "2026-11-05"}, 未処理]
        - [R-023, 高橋, {date: "2026-10-30"}, 未処理]
    expected:
      rows:
        - [R-023, 高橋, "2026-10-30", 16]
        - [R-022, 鈴木, "2026-11-05", 10]
        - [R-021, 佐藤, "2026-11-12", 3]

  - id: TC1-04
    spec_ref: 入力, 異常時の挙動
    viewpoint: シートの破損
    title: 列が挿入されていてもヘッダー名で列を特定する
    given: 「申請者」と「期限」の間に「部署」列が挿入されている
    when: 基準日 2026-11-15 で実行
    then: 列の位置に関係なく、期限切れ・未処理の1件が出る
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 部署, 期限, ステータス]
        - [R-031, 佐藤, 総務, {date: "2026-11-10"}, 未処理]
    expected:
      rows:
        - [R-031, 佐藤, "2026-11-10", 5]

  - id: TC1-05
    spec_ref: 異常時の挙動
    viewpoint: シートの破損
    title: 必要なヘッダーが見つからなければ何も出さずに止める
    given: 「期限」列のヘッダー名が「締切」に変わっている
    when: 基準日 2026-11-15 で実行
    then: 「期限」列がないというエラーになり、督促リストは書き換えない
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 締切, ステータス]
        - [R-041, 佐藤, {date: "2026-11-10"}, 未処理]
    expected:
      error: HEADER_MISSING

  - id: TC1-06
    spec_ref: 異常時の挙動, 仮定A1-2
    viewpoint: 異常値
    title: 期限が壊れている行があれば全体を止める
    given: 期限が「#REF!」の行が1件、正常な期限切れ行が1件
    when: 基準日 2026-11-15 で実行
    then: 不正な値のエラーになり、正常な行も含めて何も書かない
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 期限, ステータス]
        - [R-051, 佐藤, "#REF!", 未処理]
        - [R-052, 鈴木, {date: "2026-11-10"}, 未処理]
    expected:
      error: INVALID_VALUE

  - id: TC1-07
    spec_ref: 仮定A1-3
    viewpoint: 空の値
    title: すべて空の行は無視する
    given: データ行の後ろに空行が2行ある
    when: 基準日 2026-11-15 で実行
    then: 空行はエラーにならず、期限切れ・未処理の1件だけが出る
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 期限, ステータス]
        - [R-061, 佐藤, {date: "2026-11-10"}, 未処理]
        - ["", "", "", ""]
        - ["", "", "", ""]
    expected:
      rows:
        - [R-061, 佐藤, "2026-11-10", 5]

  - id: TC1-08
    spec_ref: ルール3
    viewpoint: 重複
    title: 申請IDが重複していたら止める
    given: 申請ID R-071 が2行ある
    when: 基準日 2026-11-15 で実行
    then: 重複のエラーになり、何も書かない
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 期限, ステータス]
        - [R-071, 佐藤, {date: "2026-11-10"}, 未処理]
        - [R-071, 鈴木, {date: "2026-11-11"}, 未処理]
    expected:
      error: DUPLICATE_ID

  - id: TC1-09
    spec_ref: 入力
    viewpoint: 空の値
    title: データ行がなければ空の督促リストを返す
    given: ヘッダー行だけのシート
    when: 基準日 2026-11-15 で実行
    then: エラーにならず、督促リストは0件
    input:
      today: "2026-11-15"
      sheet:
        - [申請ID, 申請者, 期限, ステータス]
    expected:
      rows: []
